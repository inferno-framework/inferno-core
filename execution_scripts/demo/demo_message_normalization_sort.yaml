# Exercises normalization-based message sort ordering.
#
# The test adds two messages:
#   1. "#{normalization_sort_url}: response received"  (varies by run)
#   2. "http://middle.example.com: fixed message"      (constant)
#
# With the URL used here (http://zzz.example.com), message 1 sorts after message 2
# in raw alphabetical order ('z' > 'm' after "http://"). After normalization the URL
# becomes '<NORMALIZED>', which sorts before "http://middle..." ('<' < 'h'), matching
# the order in the expected results file, which is stored normalized. (With
# http://aaa.example.com, the input's default, raw and normalized order agree.)
#
# Run with --compare-messages to exercise this behavior.

sessions:
  - suite: demo

comparison_config:
  normalized_strings:
    - 'http://aaa.example.com'
    - 'http://zzz.example.com'

steps:
  - status: created
    start_run:
      runnable: 13
      inputs:
        normalization_sort_url: 'http://zzz.example.com'

  - status: done
    last_completed: 13
    action: END_SCRIPT
