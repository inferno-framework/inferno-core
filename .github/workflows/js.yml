name: Javascript

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['24.x']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Cache Node.js modules
      uses: actions/cache@v4
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.OS }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.OS }}-node-
          ${{ runner.OS }}-
    # The lockfile may be committed from macOS, which omits Linux-specific optional
    # packages (e.g. platform-native bindings). Regenerating it here adds those
    # entries so the subsequent `npm ci` can resolve them on this Linux runner.
    - run: npm install --package-lock-only --ignore-scripts
    - run: npm ci

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['24.x']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Cache Node.js modules
      uses: actions/cache@v4
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.OS }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.OS }}-node-
          ${{ runner.OS }}-
    # The lockfile is committed from macOS, which omits Linux-specific optional
    # packages (e.g. platform-native bindings). Regenerating it here adds those
    # entries so the subsequent `npm ci` can resolve them on this Linux runner.
    - run: npm install --package-lock-only --ignore-scripts
    - run: npm ci
    # `npm run coverage` is run tests with coverage flags, rather than repeating them here
    - run: npm run coverage
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        name: frontend-coverage
        flags: frontend
        token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['24.x']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Cache Node.js modules
      uses: actions/cache@v4
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.OS }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.OS }}-node-
          ${{ runner.OS }}-
    # The lockfile is committed from macOS, which omits Linux-specific optional
    # packages (e.g. platform-native bindings). Regenerating it here adds those
    # entries so the subsequent `npm ci` can resolve them on this Linux runner.
    - run: npm install --package-lock-only --ignore-scripts
    - run: npm ci
    - run: npm run lint
